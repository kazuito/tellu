<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tixi playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;900&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Reggae+One&family=RocknRoll+One&display=block"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; background: #2b2f3a; color: #ddd; font-family: system-ui, sans-serif; }
      h2 { font-size: 14px; font-weight: 600; margin: 32px 0 8px; color: #9aa3b5; }
      .stage { position: relative; padding: 24px; background: repeating-conic-gradient(#3a3f4c 0 25%, #333743 0 50%) 0 0 / 24px 24px; border-radius: 8px; overflow: hidden; }
      .stage canvas { display: block; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px 40px; }
      .row figure { margin: 0; }
      .row figcaption { font-size: 12px; color: #9aa3b5; margin-bottom: 8px; font-family: ui-monospace, monospace; }
      #root { max-width: 1200px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
