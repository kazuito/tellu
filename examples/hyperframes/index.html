<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Tokyo Night Walk</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@800&family=Unbounded:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- tellu bundle (src/main.ts): defines window.telluCaptions for the scenes in compositions/ -->
    <script src="bundle/main.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d1f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .host {
        position: absolute;
        width: 0;
        height: 0;
      }
      .host canvas {
        position: absolute;
        display: block;
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dxb8" id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div data-hf-id="hf-3z67" id="opening" class="clip" data-composition-id="opening" data-composition-src="compositions/opening.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-sfdd" id="chapter" class="clip" data-composition-id="chapter" data-composition-src="compositions/chapter.html" data-start="5" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-vnt4" id="monologue" class="clip" data-composition-id="monologue" data-composition-src="compositions/monologue.html" data-start="10" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-sjdo" id="neon" class="clip" data-composition-id="neon" data-composition-src="compositions/neon.html" data-start="16" data-duration="4.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-86u6" id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="20.5" data-duration="3.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-q7bi" class="vignette"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
