<!DOCTYPE html>
<html lang="ja"><head></head>
  <body>
    <template id="opening-template">
      <div data-hf-id="hf-kpde" data-composition-id="opening" data-width="1920" data-height="1080" data-duration="5">
        <div data-hf-id="hf-j0ic" class="layer sky"></div>
        <div data-hf-id="hf-3p4o" class="skyline" data-layout-allow-overflow=""></div>
        <div data-hf-id="hf-x0ip" id="opening-title" class="host"></div>

        <style>
          [data-composition-id="opening"] .sky {
            background:
              radial-gradient(circle at 72% 8%, rgba(255, 61, 139, 0.28), transparent 45%),
              radial-gradient(circle at 20% 110%, rgba(0, 183, 255, 0.22), transparent 50%),
              linear-gradient(180deg, #160f38 0%, #0b0d1f 75%);
          }
          [data-composition-id="opening"] .skyline {
            position: absolute;
            left: -20px;
            right: -20px;
            bottom: 0;
            height: 340px;
            display: flex;
            align-items: flex-end;
            gap: 6px;
          }
          [data-composition-id="opening"] .bar {
            flex: none;
            transform-origin: bottom;
            background:
              repeating-linear-gradient(0deg, transparent 0 16px, rgba(255, 181, 71, 0.16) 16px 20px),
              linear-gradient(180deg, #221c4a, #110e2a);
          }
          #opening-title {
            left: 960px;
            top: 110px;
          }
        </style>

        <script>
          const skyline = document.querySelector('[data-composition-id="opening"] .skyline');
          for (let i = 0; i < 44; i++) {
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.width = `${28 + ((i * 29) % 5) * 9}px`;
            bar.style.height = `${80 + ((i * 47) % 11) * 22}px`;
            skyline.append(bar);
          }

          const tl = gsap.timeline({ paused: true });
          tl.from(".skyline .bar", { scaleY: 0, duration: 1, ease: "power3.out", stagger: { each: 0.02, from: "center" } }, 0.1);

          window.telluCaptions.attach("opening", tl, 5).then(() => {
            window.__timelines.opening = tl;
            window.__hfForceTimelineRebind?.();
          });
        </script>
      </div>
    </template>
  </body>
</html>
