pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bun run typecheck

pre-push:
  parallel: true
  jobs:
    - name: biome
      run: bunx biome ci
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test
